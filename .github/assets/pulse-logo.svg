<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="pulse-title pulse-description">
  <title id="pulse-title">PULSE</title>
  <desc id="pulse-description">Planning and Unified Lifecycle for Software Engineering, shown with a connected pulse waveform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10233d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56f2c3"/>
      <stop offset="0.52" stop-color="#35bff3"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="52" fill="url(#background)"/>
  <circle cx="1110" cy="72" r="92" fill="#35bff3" opacity="0.08"/>
  <circle cx="1034" cy="324" r="150" fill="#8b7cff" opacity="0.07"/>

  <g transform="translate(52 52)">
    <rect width="256" height="256" rx="66" fill="url(#mark)"/>
    <path d="M30 135h41l19-47 34 101 31-77 18 23h53" fill="none" stroke="url(#wave)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="135" r="10" fill="#ffffff"/>
    <circle cx="226" cy="135" r="10" fill="#ffffff"/>
    <path d="M72 70a86 86 0 0 1 119 20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <path d="M184 194a86 86 0 0 1-115-18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  </g>

  <text x="365" y="168" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="800" letter-spacing="8">PULSE</text>
  <text x="371" y="222" fill="#9fb7cf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="3.4">PLANNING &amp; UNIFIED LIFECYCLE</text>
  <text x="371" y="264" fill="#9fb7cf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="3.4">FOR SOFTWARE ENGINEERING</text>
</svg>
