name: CI (Playwright browsers)

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests with Playwright browsers available
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright browsers into CI cache
        # Use the PLAYWRIGHT_BROWSERS_PATH above so the browsers are available
        # to tests that honour the env var. `--with-deps` helps on Linux images.
        run: |
          npm init -y
          npx -y playwright install --with-deps

      - name: Run Python unit tests
        run: python3 -m unittest discover -s docs/scripts/tests
